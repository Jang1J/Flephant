# KR-Rebound-CNN Configuration
model:
  name: "KR-Rebound-CNN"
  version: "v1.0"

data:
  lookback_days: 20          # 차트 윈도우 (20 거래일)
  forecast_horizon: 5        # 예측 horizon (5 거래일)
  rebound_threshold: 0.0     # excess return label: y=1 if excess > 0.0%
  min_history_days: 60       # 최소 히스토리 요구

  features:
    ohlcv: ["open", "high", "low", "close", "volume"]
    technical: ["sma_5", "sma_20", "sma_60", "rsi_14", "macd", "bb_upper", "bb_lower"]
    sector_relative:
      - "ret_5d_sector_z"
      - "rsi_14_sector_z"
      - "close_sma20_ratio_sector_rank"
      - "volume_ratio_20_sector_pct"
    macro: ["vix_proxy", "market_breadth", "fx_rate", "base_rate"]

  # Context Branch 피처 정의 (설계서 §10.2 기준)
  # 총 context 차원 = n_context_features_base(23) + n_sectors (동적)
  #   = macro(4) + technical(5) + price_stretch(2) + sector_relative(3)
  #     + confirmation(8) + sector_onehot(n_sectors) + market_cap_rank(1)
  # universe_v1.csv 기준 11개 고유 섹터 → 23 + 11 = 34차원
  # n_sectors는 preprocess.py _build_wics_sector_list()에서 동적 계산
  context_features:
    macro:               # 4개
      - vix_proxy
      - market_breadth
      - fx_rate          # DMP 키: fx_rate (usd_krw 대응)
      - base_rate
    technical:           # 5개
      - rsi_14
      - atr_14_ratio     # atr_14 / close
      - volume_ratio_20
      - macd
      - macd_signal
    price_stretch:       # 2개
      - close_sma5_ratio    # close/sma_5 - 1
      - close_sma20_ratio   # close/sma_20 - 1
    sector_relative:     # 3개
      - ret_5d_sector_z
      - rsi_14_sector_z
      - volume_ratio_20_sector_pct
    confirmation:        # 8개 (GPT Pro #9 P0)
      - ret_5d_rank_in_sector          # 섹터 내 5일 수익률 순위 percentile
      - close_sma20_ratio_sector_rank  # 섹터 내 close/sma20 비율 순위
      - bb_pos                         # 볼린저 밴드 위치 (0~1)
      - overnight_gap                  # (open - prev_close) / prev_close
      - intraday_range                 # (high - low) / close
      - upper_shadow                   # (high - max(open,close)) / (high - low + 1e-8)
      - lower_shadow                   # (min(open,close) - low) / (high - low + 1e-8)
      - body_ratio                     # abs(close - open) / (high - low + 1e-8)
    meta:                # sector_onehot(n_sectors) + market_cap_rank(1)
      - sector_onehot    # n_sectors-dim one-hot (WICS 대분류, universe CSV에서 동적 계산)
      - market_cap_rank  # 0~1 range (percentile rank within universe)

  # n_context_features_base: sector_onehot 제외 고정 차원 수
  #   macro(4) + technical(5) + price_stretch(2) + sector_relative(3) + confirmation(8) + market_cap_rank(1) = 23
  # 최종 n_context_features = 23 + n_sectors (preprocess.py에서 계산)
  n_context_features_base: 23  # macro(4) + technical(5) + price_stretch(2) + sector_relative(3) + confirmation(8) + market_cap_rank(1)

  image:
    height: 64               # chart image height
    width: 64                # chart image width
    channels: 3              # Ch1: candlestick body-wick, Ch2: volume, Ch3: indicator overlay

training:
  batch_size: 32
  learning_rate: 0.0003
  max_epochs: 50
  early_stopping_patience: 8
  walk_forward:
    mode: "expanding"        # expanding (시작점 고정, 끝점 확장) 또는 sliding (기존 동작)
    train_window: 120        # 학습 기간 (거래일)
    val_window: 20           # 검증 기간
    step_size: 20            # 슬라이딩 스텝

  optimizer: "adamw"
  loss: "bce_with_logits"    # BCEWithLogitsLoss (pos_weight = n_neg / n_pos)
  weight_decay: 0.01
  gradient_clip: 1.0
  seed: 42
  ensemble_seeds: [42, 123, 456]

calibration:
  method: "isotonic"         # isotonic / platt
  min_samples: 100

inference:
  confidence_threshold: 0.5  # signal 분류 기준
  signal_map:
    strong_buy: 0.70
    buy: 0.55
    hold: 0.0

evaluation:
  assumed_positive_return: 0.02   # portfolio layer 가상 수익률 (y=1 종목)
  assumed_negative_return: -0.005 # portfolio layer 가상 수익률 (y=0 종목)

oversold_gate:
  train_gate_filter: false  # Gemini Pro: false=학습 시 전체 유니버스 사용 (Gate는 추론만), true=기존 동작
  min_conditions: 2
  ret_5d_threshold: 0.0        # ret_5d < 0
  rsi_14_threshold: 45
  close_sma20_threshold: 0.0   # close < sma_20 (비율 기준: ratio < 0)
  bb_pos_threshold: 0.35
  sector_ret5_z_threshold: -0.25
  sector_bottom_pct: 0.40
  relaxation:
    enabled: true
    min_candidates: 3
    rsi_relaxed: 48
    sector_bottom_pct_relaxed: 0.50
  top_n_after_gate: 5  # Gate 통과 종목 중 상위 N개만 BUY 허용

# Committee v1.1: LightGBM tree core + CNN confirmatory fusion
# enabled=false: 기존 CNN-only 동작 무변경. true로 전환 시 Stage B1+B2 활성화.
# GPT Pro: tree 0.7 / CNN 0.3 권장 (data-constrained setting에서 tree 우위)
# CNN 역할: confirmatory/complementary branch (주력 alpha가 아님)
committee:
  enabled: true
  tab_weight: 0.70
  cnn_weight: 0.30
  cnn_role: "confirmatory"  # "primary" | "confirmatory" — CNN은 확인용 branch
  agreement_threshold: 0.55
  require_directional_agreement: true  # R8: CNN과 Tab 방향 일치 요구

# Tree core 하이퍼파라미터 (committee.enabled=true 시 사용)
# LightGBM 주력, ElasticNet fallback (LightGBM 미설치 시)
tree_core:
  alpha: 0.01
  l1_ratio: 0.5

# Signal Persistence Filter (설계서 §19.2)
# enabled=false: 기존 동작 무변경. true로 전환 시 이전 거래일 SC 비교 후 신호 억제.
persistence_filter:
  enabled: false
