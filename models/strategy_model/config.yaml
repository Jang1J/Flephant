model:
  name: "LightGBM-Momentum-Ranker"
  version: "v1.0"

lgbm:
  # v2.0: sector-neutral label + binary classifier (단일 날짜 추론 호환)
  # LambdaMART는 학습 AUC 0.729이지만 단일 날짜 추론 시 cross-sectional context 부족으로
  # 모든 종목에 동일 score 출력 문제가 있음. binary + sector-neutral label이 현재 최적.
  objective: "binary"
  metric: "auc"
  num_leaves: 31
  learning_rate: 0.05
  n_estimators: 200
  min_child_samples: 10
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.1
  reg_lambda: 0.1

walk_forward:
  mode: "expanding"
  train_window: 200
  val_window: 20
  step_size: 20
  purge_days: 5
  embargo_days: 5

features:
  manual:
    - return_5d
    - return_20d
    - rsi_14
    - volume_ratio_20
    - macd
    - macd_signal
    - atr_14
    - sma5_ratio
    - sma20_ratio
    - sma60_ratio
  mlf_lite:
    # return_5d, return_20d는 manual에 이미 포함 — 여기엔 추가 피처만 등재
    - return_60d
    - period_agreement_score
  umi_lite:
    - stock_sync_score
    - market_synchronism
    - rational_price_gap
  cross_sectional_pct:
    - ret_5d_pct
    - ret_20d_pct
    - rsi_14_pct
    - volume_ratio_20_pct
    - sma5_ratio_pct
    - sma20_ratio_pct
    - sma60_ratio_pct
    - return_60d_pct
  ohlcv_micro:
    - overnight_gap
    - intraday_range
    - upper_shadow_ratio
    - lower_shadow_ratio
    - body_ratio

label:
  forward_horizon: 5
  top_quantile: 0.25

# 신호 분류 임계값 (synthesizer.py에서 로드)
signal_thresholds:
  strong_buy: 0.70
  buy: 0.55
  hold: 0.30     # risk_policy_v0.yaml min_confidence=0.3과 정렬

# 합성 가중치 (build_strategy_card_momentum.py + synthesizer.py 공통 기준)
synthesis:
  quant_weight: 0.7
  news_weight: 0.3

# 거래 비용 (backtest에서 사용)
cost_per_side: 0.00015  # 편도 0.015%
