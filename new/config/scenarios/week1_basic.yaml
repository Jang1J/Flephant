# Mode B 설정 (18:00 트리거 기준)
mode_b:
  trigger_hour_kst: 18
  expected_stages:
    - stage_0_dqr
    - stage_1_performance_analysis
    - stage_2_direction_selection
    - stage_3_factor_evolution
    - stage_4_model_evolution
    - stage_5_agent_self_improvement
