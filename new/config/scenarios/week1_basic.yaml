# S4-3 E2E 1주일 시나리오 정의
# 이 파일의 모든 임계값/수치는 yaml에서 로드. 하드코딩 금지 (불변 원칙 5).
# PIT-Safety: 각 이벤트 ts는 해당 날의 장중 시각. snapshot_ts는 18:00 KST 고정.

scenario_name: week1_basic
description: "Mode A (Hot+Cold) + Mode B 1주일 시나리오. 5 거래일 × 390분 + 5일 Mode B."
universe_tickers:
  - "005930"  # 삼성전자
  - "000660"  # SK하이닉스
  - "035420"  # NAVER
  - "005380"  # 현대차
  - "051910"  # LG화학

# 이벤트 없는 날 Hot Path tick 횟수 (390 = 09:00~15:30, 1분 단위)
hot_path_ticks_per_day: 390
# 통합 테스트용 단축 tick (전체 390 대신 5 tick만 실행)
hot_path_ticks_short: 5

days:
