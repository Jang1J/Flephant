# KOSPI Decision OS v2.2 — 커뮤니티 조작 탐지 규칙
# Mode B에서 GPT-4o가 매일 밤 갱신.
#
# v2.2 변경: mode_b_metadata 통일 블록 추가 (evolution 블록과 병기)

mode_b_metadata:
  schema_version: "1.0.0"
  data_version: "1.0.0"
  last_updated: "2026-04-06"
  updated_by: "initial"
  mode_b_editable: true            # Mode B Scheduler가 nightly로 갱신 가능
  human_approval_required: false   # 자동 반영. operator가 원하면 true로 변경
  backup_retention_days: 30        # rollback용 이전 버전 보관
  update_trigger: "mode_b_nightly"
  update_source: "새 조작 패턴 추가 (architecture.md §8.7 ⑧)"
  scope: "architecture.md §8.7 ⑧"
  rationale: "Cold Path 커뮤니티 조작 의심 필터. pump & dump / target_price_spam / coordinated_timing 감지 규칙. Mode B 야간 갱신. rule 구조 변경은 operator 승인."

version: "1.0.0"
last_updated: "2026-04-06"

rules:
  - name: "repeat_pump"
    condition: "같은 종목 + 극단 긍정 + 5분 내 10건+"
    action: "manipulation_flag = true"
  - name: "coordinated_timing"
    condition: "3개+ 계정이 1분 내 동시 게시"
    action: "manipulation_flag = true"
  - name: "extreme_sentiment"
    condition: "sentiment > 0.95 AND spike_ratio > 5.0"
    action: "manipulation_flag = true"

evolution:
  enabled: true
  trigger: "mode_b_nightly"
