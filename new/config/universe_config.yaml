# KOSPI Decision OS v3 — Universe Configuration
# 30종목 Trade Universe SSOT. Hot Path/Backtest/배포 대상은 이 파일을 따른다.
# news_filter.yaml 키워드 자동 생성의 기반.
# Sprint 5의 KOSPI200 감시는 별도 watch_universe_kospi200.yaml로 분리한다.
#
# v2.2 변경: mode_b_metadata + backtest_universe_mode 섹션 추가

mode_b_metadata:
  schema_version: "1.0.0"
  data_version: "1.2.0"                  # live-data fix: stale/invalid active tickers replaced
  last_updated: "2026-05-11"
  updated_by: "codex_live_data_gate"
  mode_b_editable: false          # universe는 Mode B가 자동 수정 금지 (수동 업데이트만)
  human_approval_required: true   # 종목 추가/제거는 operator 승인 필수
  backup_retention_days: 365      # universe는 장기 보관
  update_trigger: "manual_only"
  rationale: "universe는 실거래 대상이므로 Mode B가 자동으로 종목을 추가/제거하지 않는다. pending 10종목 확정도 operator가 수동 승인."

backtest_universe_mode:            # v2.2 — Backtest Agent universe 정책
  default: "active_only"           # Backtest는 확정 20종목만 사용
  allow_pending: false             # pending 10종목 제외
  rationale: "pending 종목은 데이터 검증 미완. Backtest 결과 신뢰도를 위해 active 20만 사용."
  override_flag: "backtest_config.include_pending"  # Sprint 4에서 overrideable
  # SHIP-fix R-1 (W1 P0 cleanup): yaml 파싱 실패 또는 sectors 비어있을 때만 발동.
  # 정상 운영에서는 sectors[X].stocks 20종목 사용. 불변 5원칙 (하드코딩 금지) 준수.
  fallback_tickers:                # safety fallback (정상 yaml 구조에서는 미사용)
    - "005930"                     # 삼성전자
    - "000660"                     # SK하이닉스

