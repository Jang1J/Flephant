run_defaults:
  python: /opt/anaconda3/envs/elephant/bin/python
  repo_root: /Users/jangjaewon/Desktop/Elephant_Lab
  research_root: artifacts/lgbm_global_search
  bundle_prefix: RESEARCH-WEEKEND
  start_80d: "20260108"
  start_full: "20250509"
  end_date: "20260521"
  max_tickers: 30
  max_runs: 105
  skip_trade_classifier: true

targets:
  - label_5m_ret
  - label_30m_net_ret
  - label_60m_net_ret
  - label_195m_net_ret
  - label_session_close_net_ret

feature_policies:
  - id: ohlcv
    include_dual_source: false
    include_exogenous: false
    dual_source_cols: []
    exogenous: false

  - id: ohlcv_exog
    include_dual_source: false
    include_exogenous: true
    dual_source_cols: []
    exogenous: true

  - id: ohlcv_exog_news
    include_dual_source: true
    include_exogenous: true
    dual_source_cols:
      - news_score_t
    exogenous: true

hyperparams:
