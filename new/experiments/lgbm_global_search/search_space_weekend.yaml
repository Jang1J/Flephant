      learning_rate: 0.05
      num_leaves: 31
      min_child_samples: 20
      subsample: 0.8
      colsample_bytree: 0.8
      lambda_l1: 0.0
      lambda_l2: 0.0
    training_control:
      n_estimators: 600
      early_stopping_rounds: 50

