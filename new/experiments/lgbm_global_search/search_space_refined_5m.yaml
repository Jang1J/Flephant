  bundle_prefix: RESEARCH-REFINED-5M
  start_80d: "20260108"
  start_full: "20250509"
  end_date: "20260521"
  max_tickers: 30
  max_runs: 36
  skip_trade_classifier: true

targets:
  - label_5m_ret

feature_policies:
