# Feature Flags — 신규 기능 활성화 제어
# 원칙: 교수님 승인 전 모든 신규 기능은 기본값 OFF
# ablation 비교를 위해 baseline 보존 필수

# K-SHIFT (Korean Shock-Hype-Investor-Flow Translator)
kshift:
  enable_ifp: false          # InvestorFlowPatch (외국인/기관/개인 수급)
  enable_osp: false          # OvernightSpilloverPatch (미국장 개장 충격)
  enable_rtg: false          # RetailThemeGraph (종토방 테마 전염)
  enable_otp: false          # OpenTrapRiskPatch (갭상승/VI/추격 위험)

# Preference Resolver
resolver:
  enable_resolver: false     # 사용자 성향별 SC 분기
  enable_canonical_routing: false  # canonical SC를 resolver-driven으로 전환 (Step 3)

# Multi-Agent Debate
debate:
  enable_debate: true        # FDA Multi-Agent Debate (이번 세션 구현 완료)

# Conformal Prediction
conformal:
  enable_conformal: true     # SC에 conformal_interval 주입 (이번 세션 구현 완료)

# O-I Decoupling
oi_decoupling:
  enable_oi_v1: true         # v1 보조 모델 (이번 세션 학습 완료)
  enable_oi_v2_mtl: false    # v2 true MTL (교수님 승인 후)

# OSP → Regime Gate 연결
regime_gate:
  enable_osp_gate: false     # baseline freeze + ablation 검증 후에만 활성화
