# ============================================================
# Risk Policy v0 — Elephant Lab
# Risk Agent 2-Tier 구조의 기본 정책 설정
# v11 제안서와 완전 동기화 (2026-03-22)
# ============================================================

version: "v0.1"
updated_at: "2026-03-22"

# ── Tier 1: Regime Gate ──────────────────────────────────────
# 시장 전체 국면 판단 → green / yellow / red
regime_gate:
  # 판정 우선순위: red → yellow → green (red 먼저 체크)
  # 경계값은 half-open interval: red >= threshold, yellow >= threshold, else green

  # VIX 프록시 (유니버스 평균 20일 변동성, 연환산 %)
  # 개별 종목 변동성 평균은 시장 지수 VIX보다 높음 (정상 범위 50~90%)
  vix_proxy:
    red_gte: 90            # >= 90%: 위험 (극단적 변동성)
    yellow_gte: 70         # >= 70% and < 90%: 주의
    # else: green          # < 70%: 정상

  # 시장 폭 (Market Breadth: 상승종목 / 전체종목)
  market_breadth:
    red_lt: 0.30           # < 30%: 위험
    yellow_lt: 0.45        # < 45% and >= 30%: 주의
    # else: green          # >= 45%: 정상

  # Regime별 행동 (v11 문서 기준)
  actions:
    green:
      max_total_exposure: 100
      new_entry_weight_multiplier: 1.0
      description: "정상 시장 — 풀 투자 가능"
    yellow:
      max_total_exposure: 100
      new_entry_weight_multiplier: 0.5    # 신규 매수 비중 × 0.5
      description: "주의 시장 — 신규 진입 비중 50% 감축"
    red:
      max_total_exposure: 100
      new_entry_weight_multiplier: 0.0    # 신규 진입 금지
      description: "위험 시장 — 신규 진입 금지 (기존 포지션은 유지/청산 판단)"

# ── Tier 2: Position-Level Constraints ───────────────────────
position_constraints:
  max_position_count: 10          # 최대 보유 종목 수
  max_single_weight: 20.0         # 단일 종목 최대 비중 (%)
  max_sector_weight: 40.0         # 단일 섹터 최대 비중 (%)
  min_confidence: 0.3             # 최소 confidence threshold

  # P85 Uncertainty Tail Cap (Phase 2+에서 활성화)
  uq_tail_cap:
    enabled: false                # Phase 1에서는 비활성화
    p85_threshold: 0.7            # P85 uncertainty > 0.7이면 비중 감축
    reduction_factor: 0.5         # 감축 비율
    # W8 추가: threshold 재검증 설정
    auto_recalibrate: false       # Phase 2에서 활성화 (Backtest 결과 기반 자동 재검증)
    auto_recalibrate_settings:
      recalibrate_lookback_days: 60    # 재검증 look-back 기간 (거래일)
      recalibrate_min_samples: 30      # 최소 샘플 수 (미달 시 현재 threshold 유지)

# ── 핵심 제약 규칙 (v11 필수) ─────────────────────────────────
core_rules:
  # Stop-loss
  stop_loss:
    threshold: -5.0               # 개별 종목 -5% 손실 시 강제 청산 (%)
    description: "종목별 stop-loss: 매입가 대비 -5% 도달 시 자동 매도 신호"

  # Turnover Cap
  turnover_cap:
    daily_max: 30.0               # 일일 최대 회전율 (%)
    description: "하루 포트폴리오 변경 비중 30% 이내 제한 (과도한 매매 방지)"

  # Minimum Cash Ratio
  min_cash_ratio:
    ratio: 10.0                   # 최소 현금 비율 (%)
    description: "포트폴리오의 최소 10%는 항상 현금으로 유지"

# ── 공통 필터 규칙 ────────────────────────────────────────────
common_filters:
  # 거래량 필터
  min_avg_volume_20d: 100000      # 20일 평균 거래량 최소치 (주)

  # 상한가/하한가 종목 제외
  exclude_limit_hit: true

  # 최소 상장일
  min_listing_days: 90            # 상장 90일 미만 종목 제외

# ── FDA 전용 추가 제약 ────────────────────────────────────────
fda_constraints:
  confidence_threshold: 0.4    # FDA 전용 confidence 임계값 (RiskEngine 0.3보다 보수적)
  low_conf_weight_cap: 10      # confidence < threshold 시 허용 최대 비중 (%)

# ── 운영 WARN 임계치 ────────────────────────────────────────
# daily_auto_trading / ops_metrics_collector 에서 사용
# 정책 hard_limit (turnover_cap.daily_max=30%)보다 낮게 설정 → 조기 경보
ops_warn_thresholds:
  turnover_warn_pct: 25.0         # 일일 회전율 WARN 임계치 (정책 30% 대비 83%)
  cash_drift_warn_pct: 10.0       # 현금 비율 변화 WARN 임계치 (%p)
  veto_warn_count: 0              # 긴급 veto WARN 임계치 (0 초과 시 WARN)
  llm_fallback_warn_rate: 0.5     # LLM fallback 비율 WARN 임계치 (0~1)

# ── 로깅 ────────────────────────────────────────────────────
audit:
  log_every_decision: true        # 모든 risk 판단을 로그에 기록
  log_path: "logs/risk_audit.jsonl"
